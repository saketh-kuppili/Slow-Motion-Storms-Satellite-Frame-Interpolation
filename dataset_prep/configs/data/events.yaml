# =============================================================================
# Candidate storm events (spec 5.2). None is assumed valid: `sms events tracks`
# derives each storm's position and 6-hour window from public NOAA records, and
# `sms events verify` checks real mesoscale coverage before any bulk download.
#
# Hurricanes: positions and intensities come from NHC's HURDAT2 best track.
#   The window is the 6 hours ending at the first intensity peak inside the
#   search interval (spec 5.2: "placed during intensification").
# Convective events: positions come from SPC's filtered storm reports for the
#   convective day (12 UTC to 12 UTC). The window is the 6-hour span with the
#   most reports; the track is the hourly median report position.
# =============================================================================

sources:
  hurdat2_url: https://www.nhc.noaa.gov/data/hurdat/hurdat2-1851-2025-092326.txt
  spc_reports_url_template: https://www.spc.noaa.gov/climo/reports/{yymmdd}_rpts_filtered.csv

events:
